[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-decision-records"
version = "0.1.0"
description = "Deterministic repository decisions, Claude hooks, and Git evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hdr = "hdr.cli:main"

[tool.setuptools]
packages = ["hdr"]

[tool.setuptools.package-data]
hdr = ["shims/*.ts"]

[tool.pyright]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
  "basedpyright==1.40.2",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
