name: Docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZINE_VERSION: v0.14.0
  ZINE_SHA256: 897642f46c3872a6311f2ab3d4c622f5f8625bfee8e1de2d0de42597c1385629

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Zine
        run: |
          curl -fsSL -o zine.tar.xz \
            "https://github.com/kristoff-it/zine/releases/download/${ZINE_VERSION}/x86_64-linux-musl.tar.xz"
          echo "${ZINE_SHA256}  zine.tar.xz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xJf zine.tar.xz -C "${RUNNER_TEMP}/bin" zine
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/zine" version

      - name: Build
        working-directory: docs
        run: zine release

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
